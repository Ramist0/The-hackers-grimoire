<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="The Hacker's Grimoire">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.55" stop-color="#150f2b"/>
      <stop offset="1" stop-color="#07211f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39ff9c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#39ff9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a5e"/>
      <stop offset="1" stop-color="#1c1436"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#39ff9c" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- binary rain, left and right edges -->
  <g font-family="'Courier New', monospace" font-size="14" fill="#39ff9c" fill-opacity="0.18">
    <text x="30" y="40">01001000 01100001</text>
    <text x="30" y="70">10110100 00101101</text>
    <text x="30" y="100">01101011 11001010</text>
    <text x="30" y="130">00110101 01010110</text>
    <text x="30" y="160">11010010 10010011</text>
    <text x="30" y="190">01011001 00111010</text>
    <text x="30" y="220">10100110 01101100</text>
    <text x="30" y="250">00011101 11010001</text>
    <text x="30" y="280">01110010 10101001</text>
    <text x="30" y="310">11001011 00100110</text>
    <text x="30" y="340">01010101 01101011</text>
    <text x="30" y="370">10010110 11100100</text>
    <text x="1140" y="40">10100101 01010011</text>
    <text x="1140" y="70">01101100 11001001</text>
    <text x="1140" y="100">00111010 10100110</text>
    <text x="1140" y="130">11010110 01001011</text>
    <text x="1140" y="160">01001101 00110101</text>
    <text x="1140" y="190">10110010 11010100</text>
    <text x="1140" y="220">01100101 10011010</text>
    <text x="1140" y="250">11001010 01011101</text>
    <text x="1140" y="280">00101101 10110011</text>
    <text x="1140" y="310">10010011 01101010</text>
    <text x="1140" y="340">01110100 11001001</text>
    <text x="1140" y="370">10101010 00110110</text>
  </g>

  <!-- glow behind the book -->
  <ellipse cx="220" cy="205" rx="190" ry="170" fill="url(#glow)"/>

  <!-- the grimoire -->
  <g transform="translate(110 85)">
    <rect x="12" y="14" width="200" height="250" rx="10" fill="#000" opacity="0.45" filter="url(#soft)"/>
    <rect x="0" y="0" width="200" height="250" rx="10" fill="url(#cover)" stroke="#39ff9c" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="0" y="0" width="26" height="250" rx="10" fill="#120c24" stroke="#39ff9c" stroke-opacity="0.45" stroke-width="1.5"/>
    <g stroke="#39ff9c" stroke-opacity="0.5" stroke-width="2">
      <line x1="8" y1="40" x2="18" y2="40"/>
      <line x1="8" y1="125" x2="18" y2="125"/>
      <line x1="8" y1="210" x2="18" y2="210"/>
    </g>
    <rect x="42" y="18" width="142" height="214" rx="4" fill="none" stroke="#39ff9c" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- pentagram -->
    <g transform="translate(113 112)" fill="none" stroke="#39ff9c" stroke-width="2.5" stroke-linejoin="round">
      <circle r="52" stroke-opacity="0.8"/>
      <circle r="44" stroke-opacity="0.35" stroke-width="1"/>
      <polygon points="0,-44 25.9,35.6 -42,-13.6 42,-13.6 -25.9,35.6" stroke-opacity="0.95"/>
    </g>
    <!-- terminal prompt on the cover -->
    <text x="113" y="200" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="700" fill="#39ff9c">&gt;_ ./cast</text>
  </g>

  <!-- title block -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="400" y="150" font-size="26" fill="#b9a7ff" letter-spacing="8">THE</text>
    <text x="400" y="225" font-size="66" font-weight="700" fill="#f2f0ff" letter-spacing="1">Hacker's Grimoire</text>
    <text x="402" y="228" font-size="66" font-weight="700" fill="#39ff9c" fill-opacity="0.18" letter-spacing="1">Hacker's Grimoire</text>
  </g>
  <line x1="402" y1="248" x2="1010" y2="248" stroke="#39ff9c" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="1018" cy="248" r="4" fill="#39ff9c"/>
  <text x="402" y="288" font-family="'Courier New', monospace" font-size="21" fill="#9ff5cf">$ cybersecurity notes, cheat sheets &amp; memos</text>
  <text x="402" y="322" font-family="'Courier New', monospace" font-size="17" fill="#8a84b5">Web Security  ·  CTF  ·  Certifications</text>
</svg>
